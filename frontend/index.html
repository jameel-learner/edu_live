<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Edukripa</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="style.css" />
  <script>
    (function () {
      try {
        var saved = localStorage.getItem("edukripa-theme");
        if (saved) document.documentElement.setAttribute("data-theme", saved);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <header class="app-header">
    <div class="app-header-inner">
      <div>
        <h1>Edukripa</h1>
        <p class="app-subtitle">Ask questions about your uploaded notes.</p>
      </div>
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle dark/light theme">Theme</button>
    </div>
  </header>

  <main class="app-main">
    <section class="card" id="chat-section">
      <div class="mode-toggle" role="tablist">
        <button type="button" class="mode-btn active" data-mode="chat" role="tab" aria-selected="true">Chat</button>
        <button type="button" class="mode-btn" data-mode="explain" role="tab" aria-selected="false">Concept Explainer</button>
        <button type="button" class="mode-btn" data-mode="questionPaper" role="tab" aria-selected="false">Question Paper</button>
      </div>
      <h2 id="chat-section-title">Ask a question</h2>
      <div id="chat-log"></div>
      <div id="question-paper-panel" class="question-paper-panel" hidden>
        <div class="qp-picker">
          <label for="qp-subject-select">Subject</label>
          <select id="qp-subject-select"></select>
          <label for="qp-class-select">Class</label>
          <select id="qp-class-select"></select>
          <fieldset id="qp-chapter-list"><legend>Chapters</legend></fieldset>
          <label for="qp-marks-select">Total Marks</label>
          <select id="qp-marks-select">
            <option value="40">40</option>
            <option value="80">80</option>
          </select>
          <button type="button" id="qp-generate-btn">Generate</button>
        </div>
        <div id="qp-result"></div>
      </div>
      <form id="chat-form">
        <select id="answer-style-select" title="Answer length">
          <option value="auto" selected>Auto</option>
          <option value="short">1-2 Marks</option>
          <option value="detailed">5 Marks</option>
        </select>
        <input type="text" id="question-input" placeholder="Ask a science or maths question..." required />
        <button type="submit">Send</button>
      </form>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
